<div class="rounded-lg border bg-card shadow-sm">
  <div class="px-3 py-2 border-b">
    <h4 class="text-xs font-semibold text-muted-foreground">Programs</h4>
  </div>
  <ui-data-table
    [columns]="tableColumns"
    [data]="pageData()"
    [total]="programs().length"
    [loading]="false"
    [rowTemplate]="programRow"
    (pageChange)="onPage($event)" />
</div>

<ng-template #programRow let-program>
  <tr [attr.data-program-row]="program.id"
    class="border-b last:border-0 cursor-pointer hover:bg-muted/50"
    (click)="programSelected.emit(program.id)">
    <td class="px-3 py-1.5 text-[11px] font-medium">{{ program.name }}</td>
    <td class="px-3 py-1.5 text-[11px] text-muted-foreground">{{ program.region }}</td>
    <td class="px-3 py-1.5 text-[11px] text-center">{{ program.projectCount }}</td>
    <td class="px-3 py-1.5 text-[11px] text-right font-medium">{{ metricValue(program, 'MW1.1') }}</td>
    <td class="px-3 py-1.5 text-[11px] text-right font-medium">{{ metricValue(program, 'CV1.1') }}</td>
    <td class="px-3 py-1.5 text-[11px] text-right font-medium">{{ metricValue(program, 'SB1.1') }}</td>
    <td class="px-3 py-1.5">
      <lucide-icon name="chevron-right" class="h-3.5 w-3.5 text-muted-foreground" />
    </td>
  </tr>
</ng-template>
