<td class="px-4 py-3">
  <div class="flex min-w-0 items-center gap-2">
    <div
      [class]="avatarClass()"
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-bold"
    >
      {{ initials() }}
    </div>

    <div class="min-w-0">
      <p class="truncate text-sm font-medium" [title]="user().displayName">
        {{ user().displayName }}
      </p>

      <p class="truncate text-xs text-muted-foreground" [title]="user().email">
        {{ user().email }}
      </p>
    </div>
  </div>
</td>

<td class="px-4 py-3">
  <div class="whitespace-nowrap">
    <ui-badge [styleClass]="roleColor()" data-role-badge>
      {{ user().roleName }}
    </ui-badge>
  </div>
</td>

<td class="px-4 py-3">
  <div class="whitespace-nowrap">
    <ui-badge [styleClass]="statusColor()" data-status-badge>
      {{ user().isActive ? 'Active' : 'Inactive' }}
    </ui-badge>
  </div>
</td>

<td class="whitespace-nowrap px-4 py-3 text-sm text-muted-foreground" data-last-login>
  {{ user().lastLoginUtc | date: 'dd MMM yyyy, h:mm a' }}
</td>
@if (canDelete()) {
  <td class="px-4 py-3">
    <button
      type="button"
      class="inline-flex h-8 w-8 items-center justify-center rounded-md text-muted-foreground hover:bg-red-50 hover:text-red-600"
      title="Delete user"
      (click)="onDeleteClick($event)"
    >
      <lucide-icon name="trash-2" class="h-4 w-4" />
    </button>
  </td>
}
