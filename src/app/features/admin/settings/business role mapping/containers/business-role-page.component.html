<div class="flex flex-col gap-6 font-sans text-foreground">
  <!-- Header -->
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h1 class="font-heading text-xl font-bold">
        {{ 'BUSINESS_ROLE.TITLE' | transloco }}
      </h1>
      <p class="text-sm text-muted-foreground">
        {{ 'BUSINESS_ROLE.DESCRIPTION' | transloco }}
      </p>
    </div>
    <button
      (click)="openAddDialog()"
      class="flex items-center gap-2 rounded-md bg-[hsl(var(--aepw-blue))] px-4 py-2 text-sm font-medium text-white hover:opacity-90"
    >
      <lucide-icon name="plus" class="h-4 w-4" />{{ 'BUSINESS_ROLE.ADD_ROLE' | transloco }}
    </button>
  </div>

  <!-- Filter bar -->
  <ui-card>
    <ui-card-content styleClass="flex flex-wrap items-center justify-between gap-3 p-4">
      <!-- User -->
      <div class="flex gap-4">
        <ng-select
          class="w-56"
          [items]="businessRoleUsers()"
          bindLabel="displayName"
          bindValue="userId"
          [searchable]="true"
          [clearable]="true"
          placeholder="All Users"
          [ngModel]="selectedUserId()"
          (ngModelChange)="onUserFilterChange($event)"
        />
        <!-- Business Role -->
        <ng-select
          class="w-56"
          [items]="businessRoles()"
          bindLabel="businessRoleName"
          bindValue="businessRoleId"
          [searchable]="true"
          [clearable]="true"
          placeholder="All Business Roles"
          [ngModel]="selectedBusinessRoleId() || null"
          (ngModelChange)="onBusinessRoleFilterChange($event)"
        />
      </div>
      <!-- Clear Filters -->
      <button type="button" class="rounded-md border px-3 py-2 text-sm" (click)="clearFilters()">
        Clear Filters
      </button>
    </ui-card-content>
  </ui-card>

  <!-- Table -->
  <ui-card>
    <ui-card-content styleClass="p-0">
      <ui-data-table
        [columns]="tableColumns"
        [data]="pageData()"
        [total]="pageTotal()"
        [loading]="loading()"
        [rowTemplate]="userRow"
        (pageChange)="onTableChange($event)"
      />
    </ui-card-content>
  </ui-card>
</div>

<!-- Row template -->
<ng-template #userRow let-row>
  <tr
    class="border-b"
    class="border-b cursor-pointer hover:bg-muted/50 transition-colors"
    (click)="editMapping(row)"
  >
    <td class="px-4 py-3">
      {{ row.businessRoleName }}
    </td>

    <td class="px-4 py-3">
      {{ row.userName }}
    </td>

    <td class="px-4 py-3 text-center">
      <button
        type="button"
        class="inline-flex h-8 w-8 items-center justify-center rounded-md text-muted-foreground hover:bg-red-50 hover:text-red-600 disabled:cursor-not-allowed disabled:opacity-50"
        title="Delete business role mapping"
        [attr.aria-label]="'Delete business role mapping for ' + row.businessRoleName"
        [disabled]="deleteLoading()"
        (click)="$event.stopPropagation(); openDeleteDialog(row.businessRoleMappingId)"
      >
        <lucide-icon name="trash-2" class="h-4 w-4" />
      </button>
    </td>
  </tr>
</ng-template>

<!-- Delete Business Role Mapping Dialog -->
<ui-dialog
  [(visible)]="showDeleteModal"
  header="Delete Business Role Mapping"
  styleClass="max-w-2xl user-dialog"
  (closed)="onDeleteDialogClosed()"
>
  <div class="flex flex-col gap-5 p-5">
    <div class="flex items-start gap-3">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-red-50 text-red-600"
      >
        <lucide-icon name="trash-2" class="h-5 w-5" />
      </div>

      <div class="min-w-0 flex-1">
        <p class="text-sm text-muted-foreground">
          Are you sure you want to delete this business role mapping?
        </p>
        @if (selectedMapping(); as mapping) {
          <p class="mt-1 text-base font-semibold text-foreground">
            {{ mapping.businessRoleName }} - {{ mapping.userName }}
          </p>
        }
      </div>
    </div>

    <div class="flex justify-end gap-2 border-t pt-4">
      <button
        type="button"
        class="rounded-md border px-4 py-2 text-sm disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="deleteLoading()"
        (click)="cancelDeleteMapping()"
      >
        {{ 'COMMON.CANCEL' | transloco }}
      </button>

      <button
        type="button"
        class="inline-flex items-center rounded-md bg-red-600 px-4 py-2 text-sm text-white hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="deleteLoading()"
        [attr.aria-busy]="deleteLoading()"
        (click)="confirmDeleteMapping()"
      >
        <lucide-icon name="trash-2" class="mr-1.5 h-4 w-4" />
        {{ deleteLoading() ? 'Deleting...' : 'Confirm' }}
      </button>
    </div>
  </div>
</ui-dialog>

<!-- Add User Dialog -->
<ui-dialog
  [(visible)]="showAddModal"
  [header]="
    editingMappingId()
      ? ('BUSINESS_ROLE.EDIT_ROLE' | transloco)
      : ('BUSINESS_ROLE.ADD_ROLE' | transloco)
  "
  styleClass="max-w-4xl user-dialog"
>
  <form [formGroup]="businessRoleForm" (ngSubmit)="saveBusinessRole()">
    <div class="flex flex-col gap-4 p-4">
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="text-sm font-medium">
            {{ 'BUSINESS_ROLE.BUSINESS_ROLE_LABEL' | transloco }}
          </label>
          <ng-select
            formControlName="businessRoleId"
            [items]="businessRoles()"
            bindLabel="businessRoleName"
            bindValue="businessRoleId"
            [placeholder]="'BUSINESS_ROLE.SELECT_BUSINESS_ROLE' | transloco"
            [clearable]="false"
          />
        </div>
        <!-- USER -->
        <div class="space-y-2">
          <label class="text-sm font-medium">
            {{ 'BUSINESS_ROLE.USER_LABEL' | transloco }}
          </label>

          <ng-select
            formControlName="userId"
            [items]="users()"
            bindLabel="displayName"
            bindValue="userId"
            [typeahead]="userSearch$"
            [minTermLength]="3"
            [clearable]="true"
            [placeholder]="'BUSINESS_ROLE.SELECT_USER' | transloco"
            (clear)="onUserClear()"
          />
        </div>
      </div>
      <!-- ACTION BUTTONS -->
      <div class="flex justify-end gap-2">
        <button (click)="showAddModal.set(false)" class="rounded-md border px-4 py-2 text-sm">
          {{ 'COMMON.CANCEL' | transloco }}
        </button>
        <button
          type="submit"
          class="rounded-md bg-[hsl(var(--aepw-blue))] px-4 py-2 text-sm text-white"
        >
          {{ editingMappingId() ? ('COMMON.UPDATE' | transloco) : ('COMMON.ADD' | transloco) }}
        </button>
      </div>
    </div>
  </form>
</ui-dialog>
