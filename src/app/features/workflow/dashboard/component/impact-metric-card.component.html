<div class="w-full h-[84px]
         rounded-lg
         border border-gray-200
         bg-white
         p-3 shadow-sm" >

  <!-- Top -->
  <div class="flex items-center justify-between">

    <!-- Code -->
    <span class="inline-flex
             items-center
             justify-center
             min-w-[44px]
             h-6
             px-2
             rounded-full
             text-[10px]
             font-semibold
             text-white" [style.background-color]="metric().color">
      {{ metric().code }}
    </span>

    <!-- Growth -->
   <div class="flex items-center gap-1">

      <!-- Quarterly Growth -->
      <span
        class="text-xs font-medium"
        [class]="getGrowthClass(metric().quarterlyGrowth)"
      >
        Q
        <span>{{ getGrowthIcon(metric().quarterlyGrowth) }}</span>
        {{ getGrowthValue(metric().quarterlyGrowth) }}
      </span>


      <!-- Annual Growth -->
      <span
        class="text-xs font-medium"
        [class]="getGrowthClass(metric().annualGrowth)"
      >
        Y
        <span>{{ getGrowthIcon(metric().annualGrowth) }}</span>
        {{ getGrowthValue(metric().annualGrowth) }}
      </span>

    </div>
  </div>


  <!-- Value -->
  <div class="mt-2
           text-l
           font-bold
           text-[#17324D]">
  {{ formatValue(metric().riskAdjustment) }}
  </div>


  <!-- Name -->
  <div class="mt-1
           text-xs
           leading-4
           text-gray-500
           truncate" [title]="metric().name">
    {{ metric().name }}
  </div>

</div>
