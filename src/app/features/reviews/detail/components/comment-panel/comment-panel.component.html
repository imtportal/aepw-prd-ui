<!-- Comment Sidebar (this quarter's comments) -->
@if (isCommentsPanelOpen()) {
<div class="fixed inset-0 z-40 bg-black/20" (click)="closeCommentSidebar()"></div>
<div class="fixed right-0 top-0 z-50 flex h-full w-96 flex-col border-l bg-card shadow-xl">
  <div class="flex items-center justify-between border-b px-5 py-4">
    <h2 class="text-sm font-semibold">Comments — {{ period() }}</h2>
    <button type="button" (click)="closeCommentSidebar()" class="text-muted-foreground hover:text-foreground">
      <lucide-icon name="x" [size]="16" />
    </button>
  </div>
  <div class="flex-1 overflow-y-auto px-5 py-4">
    <app-comment-thread [addingComments]="addingComments()" (addComment)="handleAddComment($event)"
    [showHeader]="false"
    [allowMentioningUsers]="allowMentioningUsers()"
      [comments]="comments()" />
    <!-- (addComment)="onAddComment($event)"
          (addReply)="onAddReply($event)" -->
  </div>
</div>
}
