<!-- Mobile: compact "Step N of 4 · Label" + progress dots -->
<div class="flex items-center justify-between md:hidden">
  <span class="text-sm font-medium text-foreground">
    Step {{ currentStep() + 1 }} of {{ steps().length }}&nbsp;·&nbsp;{{ steps()[currentStep()].label }}
  </span>
  <div class="flex gap-1">
    @for (step of steps(); let i = $index; track i) {
      <div class="h-1.5 w-6 rounded-full"
           [class.bg-primary]="i === currentStep()"
           [style.background-color]="i < currentStep() ? 'hsl(var(--aepw-green) / 0.6)' : null"
           [class.bg-muted]="i > currentStep()">
      </div>
    }
  </div>
</div>

<!-- Tablet+: full horizontal stepper (unchanged) -->
<div class="hidden md:flex items-center gap-2" data-stepper>
  @for (step of steps(); let i = $index; track i) {
    <div class="flex items-center gap-2">
      <div
        [attr.data-step]="i"
        [attr.data-active]="i === currentStep()"
        [attr.data-done]="i < currentStep()"
        class="flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium transition-colors"
        [class.bg-primary]="i === currentStep()"
        [class.text-primary-foreground]="i === currentStep()"
        [class.text-green-700]="i < currentStep()"
        [class.bg-muted]="i > currentStep()"
        [class.text-muted-foreground]="i > currentStep()"
        [style.background-color]="i < currentStep() ? 'hsl(var(--aepw-green) / 0.15)' : null"
      >
        @if (i < currentStep()) {
          <lucide-icon name="circle-check" [size]="16" />
        } @else {
          <span class="flex h-5 w-5 items-center justify-center rounded-full bg-black/10 text-xs font-bold">
            {{ i + 1 }}
          </span>
        }
        <span class="hidden sm:inline" [attr.data-step-label]="i">{{ step.label }}</span>
      </div>
      @if (i < steps().length - 1) {
        <lucide-icon name="chevron-right" [size]="16" class="shrink-0 text-muted-foreground" />
      }
    </div>
  }
</div>
