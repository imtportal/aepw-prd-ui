<div data-period-step class="flex flex-col gap-4">
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium text-foreground">Reporting Period</label>
    <ui-select
      data-period-select
      [ngModel]="selectedPeriod()"
      (ngModelChange)="periodChange.emit($event)"
      [options]="periodOptions"
      styleClass="w-full"
    />
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-foreground">Start Date</label>
      <input
        type="date"
        data-start-date
        [value]="startDate()"
        (change)="startDateChange.emit($any($event.target).value)"
        class="h-9 rounded-md border border-input bg-card px-3 text-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-foreground">End Date</label>
      <input
        type="date"
        data-end-date
        [value]="endDate()"
        (change)="endDateChange.emit($any($event.target).value)"
        class="h-9 rounded-md border border-input bg-card px-3 text-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
      />
    </div>
  </div>
</div>
