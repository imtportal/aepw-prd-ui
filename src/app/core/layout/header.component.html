<header class="flex h-14 shrink-0 items-center gap-3 border-b bg-card px-4 sm:px-6">
  <button
    (click)="toggleSidebar()"
    class="flex h-8 w-8 -ml-2 items-center justify-center rounded-md hover:bg-muted transition-colors md:hidden"
    aria-label="Toggle sidebar"
  >
    <lucide-icon name="panel-left" [size]="16" class="text-foreground" />
  </button>
  <div class="h-5 w-px bg-border md:hidden"></div>
  <h1 class="font-heading text-lg font-bold tracking-wide text-foreground">{{ pageTitle() }}</h1>
</header>
