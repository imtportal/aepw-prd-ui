<div class="relative" [class]="styleClass()">
  <select
    class="w-full h-9 appearance-none rounded-md border border-input bg-card pl-3 pr-8 text-sm text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer"
    [disabled]="isDisabled"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    (blur)="onTouched()"
  >
    @if (placeholder()) {
      <option [ngValue]="null">
        {{ placeholder() }}
      </option>
    }

    @for (opt of options(); track $index) {
      <option [ngValue]="getOptionValue(opt)">
        {{ getOptionLabel(opt) }}
      </option>
    }
  </select>

  <svg
    class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground"
    xmlns="http://www.w3.org/2000/svg"
    width="14"
    height="14"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="m6 9 6 6 6-6" />
  </svg>
</div>
