<div class="relative" [class]="styleClass()">
  <svg
    class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground"
    xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.3-4.3"/>
  </svg>
  <input
    class="w-full rounded-md border border-input bg-card pl-9 pr-3 placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
    [class]="inputClass()"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="onInput($event)"
  />
</div>
