<p-dialog
  [(visible)]="visible"
  (onHide)="onDialogHide()"
  [header]="header()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [styleClass]="dialogClass()"
  transitionOptions="320ms cubic-bezier(0.4, 0, 0.2, 1)"
>
  <ng-content />
  <ng-template pTemplate="footer">
    <ng-content select="[slot=footer]" />
  </ng-template>
</p-dialog>
