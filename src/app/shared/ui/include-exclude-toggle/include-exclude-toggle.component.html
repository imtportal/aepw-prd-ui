<button
  type="button"
  data-include-exclude-toggle
  class="inline-flex cursor-pointer items-center gap-1.5 rounded-full border border-transparent py-0.5 pl-0.5 pr-2 transition-colors"
  (click)="includedChange.emit(!included())"
>
  <span
    class="relative inline-flex h-5 w-9 flex-shrink-0 rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out bg-primary"
  >
    <span
      class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition-transform duration-200 ease-in-out"
      [class]="included() ? 'translate-x-4' : 'translate-x-0'"
    ></span>
  </span>
  <span
    class="text-xs font-medium whitespace-nowrap"
    [class]="included() ? 'text-[hsl(var(--aepw-orange))]' : 'text-[hsl(var(--aepw-green))]'"
  >{{ included() ? 'Exclude' : 'Include' }}</span>
</button>
