<div class="rounded-lg border bg-card">
  <div class="px-3 py-2 border-b">
    <h4 class="text-xs font-semibold text-muted-foreground">{{ title() }}</h4>
  </div>
  @if (embedConfig(); as cfg) {
    <div #embedContainer data-pbi-embed class="h-[200px]"></div>
  } @else {
    <div data-pbi-placeholder
      class="h-[200px] flex flex-col items-center justify-center gap-2 text-muted-foreground/40">
      <lucide-icon name="chart-bar" class="h-8 w-8" />
      <p class="text-xs">Power BI report · Connect when ready</p>
    </div>
  }
</div>
