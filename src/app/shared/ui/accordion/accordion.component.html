<button
  type="button"
  [class]="cn(
    'flex w-full items-center justify-between py-4 px-5 text-sm font-medium text-left',
    'transition-all hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring',
    styleClass()
  )"
  (click)="panel.toggle()"
>
  <ng-content />
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="16" height="16" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"
    [class]="cn('shrink-0 transition-transform', panel.isOpen() ? 'rotate-180' : '')"
    aria-hidden="true"
  ><polyline points="6 9 12 15 18 9"/></svg>
</button>
