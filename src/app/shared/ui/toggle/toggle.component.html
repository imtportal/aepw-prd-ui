<label class="relative inline-flex cursor-pointer items-center">
  <input type="checkbox" class="sr-only peer"
         [checked]="checked()"
         (change)="checkedChange.emit($any($event.target).checked)" />
  <div data-toggle-track
       class="h-5 w-9 rounded-full bg-muted peer-checked:bg-[hsl(var(--aepw-blue))] transition-colors"></div>
  <div data-toggle-thumb
       class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-white shadow transition-transform peer-checked:translate-x-4"></div>
</label>
