@if (isOpen) {
  <!-- Backdrop -->
  <div class="fixed inset-0 z-40 bg-black/40" (click)="onBackdropClick()"></div>
}

<div
  class="fixed top-0 right-0 z-50 flex h-screen w-[400px] max-w-full flex-col bg-white shadow-2xl transition-transform duration-300 ease-in-out"
  [class.translate-x-0]="isOpen"
  [class.translate-x-full]="!isOpen"
>
  <!-- Header -->
  <div class="flex items-center justify-between border-b px-6 py-5">
    <h2 class="flex items-center gap-2 text-lg font-semibold text-slate-700">
      <ui-badge [backgroundColor]="badgeColor!">{{ badgeText }}</ui-badge>

      {{ title }}
    </h2>

    <button
      type="button"
      class="text-2xl leading-none text-slate-500 hover:text-slate-700"
      (click)="onClose()"
    >
      ×
    </button>
  </div>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto p-6">
    <ng-content></ng-content>
  </div>

  <!-- Footer -->
  <div class="flex justify-end gap-3 border-t bg-white px-6 py-4">
    <!-- <button
      type="button"
      class="rounded-md border border-slate-300 px-5 py-2 text-sm font-medium hover:bg-slate-50"
      (click)="onCancel()"
    >
      Cancel
    </button>

    <button
      type="button"
      class="rounded-md bg-sky-700 px-5 py-2 text-sm font-medium text-white hover:bg-sky-800"
      (click)="onSave()"
    >
      Save
    </button> -->
  </div>
</div>
